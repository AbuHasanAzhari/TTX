# Netlify: menyajikan hasil build Vite sebagai situs statis.
#
# Dipakai untuk menguji impor sheet inject di layar fasilitator. Semua yang
# berjalan sebelum tombol "Buka ruangan" dikerjakan di browser, jadi tidak
# butuh server: pembacaan Excel, deteksi tipe soal, peringatan impor, urutan
# inject, tabel waktu per inject, dan kode unit yang dibangkitkan.
#
# Yang tidak akan jalan di sini: membuka ruangan dan seterusnya, karena itu
# butuh server.js yang memegang WebSocket. Netlify tidak menjalankan proses.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Aplikasi memakai rute berbasis path (/host dan /screen), bukan hash. Tanpa
# aturan ini Netlify mencari berkas bernama "host" dan mengembalikan 404.
# Status 200 berarti ditulis ulang, bukan dialihkan, jadi alamat di bilah
# browser tetap /host dan aplikasi membaca rutenya dengan benar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
